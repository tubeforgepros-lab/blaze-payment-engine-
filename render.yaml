services:
  - type: web
    name: blaze-payment-engine
    runtime: python
    plan: starter
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: blaze-ledger-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: BLAZE_ENV
        value: production
      - key: BLAZE_DB_PATH
        value: /var/data/blaze_ledgers.db
      - key: BLAZE_SEED_BALANCE
        value: "0.00"
      - key: BLAZE_ALLOWED_ORIGINS
        sync: false
      - key: BLAZE_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_ENV
        value: sandbox
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
